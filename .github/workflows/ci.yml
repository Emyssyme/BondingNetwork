name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install runtime dependencies
        run: python -m pip install --require-hashes -r requirements.lock.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run v2 handshake unit tests
        run: python -m unittest test_handshake -v
      - name: Check shell syntax
        if: runner.os == 'Linux'
        run: |
          bash -n server/setup_linux.sh
          bash -n server/rotate_secret.sh

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install dependencies and quality tools
        run: |
          python -m pip install --require-hashes -r requirements.lock.txt
          python -m pip install ruff==0.17.5 bandit==1.9.4 pip-audit==2.10.1
      - name: Run Ruff
        run: ruff check . --select E4,E7,E9,F63,F7,F82 --ignore E701
      - name: Run Bandit
        run: bandit -r . -x tests,.git -lll
      - name: Audit locked application dependencies
        run: pip-audit -r requirements.lock.txt
      - name: Audit locked relay dependencies
        run: pip-audit -r server/requirements.lock.txt
